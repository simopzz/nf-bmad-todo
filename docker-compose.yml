services:
  backend:
    build:
      context: ./todo-backend
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - db-data:/app/data
    expose:
      - "8000"

  frontend:
    build:
      context: ./todo-frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  db-data:
