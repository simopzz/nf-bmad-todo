repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.8  # align with ruff version in pyproject.toml dev deps
    hooks:
      - id: ruff-check
        args: [--fix]
        types_or: [python, pyi]
        files: ^todo-backend/.*\.py$

      - id: ruff-format
        types_or: [python, pyi]
        files: ^todo-backend/.*\.py$

  - repo: local
    hooks:
      - id: ty
        name: ty type check
        entry: uv run --project todo-backend ty check todo-backend/
        language: system
        files: ^todo-backend/.*\.py$
        pass_filenames: false

      - id: frontend-lint
        name: frontend lint
        entry: npm --prefix todo-frontend run lint
        language: system
        files: ^todo-frontend/
        pass_filenames: false

      - id: frontend-type-check
        name: frontend type check
        entry: npm --prefix todo-frontend run type-check
        language: system
        files: ^todo-frontend/
        pass_filenames: false

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []  # allow all conventional commit types
